services:
  postgres:
    image: postgres:17

    container_name: mrip_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: mrip
      POSTGRES_PASSWORD: mrip_password
      POSTGRES_DB: mrip_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrip -d mrip_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: